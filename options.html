<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect ApplyMate</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="setup-shell">
      <section class="setup-card">
        <div class="brand"><span>A</span> ApplyMate</div>
        <div class="agent-mark"><span>✓</span></div>
        <p class="eyebrow">ONE-TIME SETUP</p>
        <h1>Connect your browser agent.</h1>
        <p class="intro">Your profile stays in the ApplyMate dashboard. Connect once and the agent will securely sync it whenever you fill a form.</p>
        <form id="connectionForm">
          <label>ApplyMate dashboard URL<input name="serverUrl" type="url" value="http://localhost:8787" required /></label>
          <label>Pairing token<input name="deviceToken" type="password" autocomplete="off" placeholder="am_…" required /></label>
          <button id="connectButton" class="primary" type="submit">Connect and sync profile</button>
        </form>
        <section id="connectionResult" class="result" hidden>
          <span>✓</span><div><strong id="resultTitle">Agent connected</strong><p id="resultText"></p></div>
        </section>
        <p id="connectionStatus" class="status" role="status"></p>
        <section class="behavior">
          <h2>How your agent behaves</h2>
          <label class="check"><input id="autoFill" type="checkbox" checked /><span><strong>Fill known answers automatically</strong><small>ApplyMate fills safe matching fields when an application form opens.</small></span></label>
          <label class="check"><input id="requireCaptchaConfirmation" type="checkbox" checked /><span><strong>Require final review and CAPTCHA confirmation</strong><small>No form is submitted until you approve it.</small></span></label>
        </section>
        <footer><span>Your dashboard profile is the single source of truth.</span><a id="openDashboard" href="http://localhost:8787/#connections" target="_blank">Open dashboard</a></footer>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
